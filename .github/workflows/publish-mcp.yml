name: Publish to the MCP Registry

# WHY THIS EXISTS.
#
# Publishing used to require `mcp-publisher login github`, an interactive device
# flow: a human reads a code off a terminal and types it into github.com. That
# is fine once and corrosive as a habit. The registry drifted to 1.10.0 while
# the deployed Worker served 1.11.0, because the only thing standing between
# "released" and "published" was somebody remembering to do it by hand within
# the JWT's sub-hour lifetime.
#
# GitHub Actions can authenticate to the registry with OIDC instead. The runner
# proves it is this repository, the registry maps that to the
# io.github.asokore/* namespace, and no long-lived secret exists to leak. So
# publishing becomes a consequence of releasing rather than a separate chore.
#
# Triggered by publishing a GitHub Release, which is the moment the version
# genuinely exists, and manually for backfills.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # THE GATE. On 19 September 2026, 1.13.0 was published from a tree whose
  # bench-equivalence job was red: CI run 35445862342 failed at 13:28:29 and the
  # release-triggered publish started 21 seconds later and succeeded. The check
  # existed and had already run. What was missing was anything standing between
  # it and the publish, so a checklist would not have helped.
  #
  # SELF-CONTAINED rather than polling the Actions API for a green conclusion at
  # github.sha: the push CI run is usually still in flight when the release
  # fires, so a poll needs a wait loop; a cancelled run satisfies a naive
  # "not failure" check; and a release cut from a commit with no CI run has
  # nothing to poll for. Checkout on a release event resolves github.sha to the
  # tag commit, so this tests exactly the tree being published.
  #
  # SEPARATE JOB, not a step inside publish. That job can mint an OIDC token for
  # the io.github.asokore namespace, which is why mcp-publisher below is pinned
  # and checksummed. `npm install` runs dependency lifecycle scripts, so it does
  # not belong there. This job inherits the workflow's contents: read and has no
  # id-token.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          # Pinned to match ci.yml. A green gate has to mean what a green CI
          # means, and the equivalence test imports a .ts module directly.
          node-version: 22
      # npm install, not npm ci: package-lock.json is gitignored, so there is
      # no lockfile to install from. Same reason ci.yml uses install.
      - run: npm install
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm test
        working-directory: server
      # No install: caribstat has no dependencies, same as ci.yml's job.
      - run: npm test
        working-directory: caribstat
      # METHODOLOGY section 4. This is the check that was red on 19 September 2026.
      - run: node bench/tools/equivalence.test.mjs
      # NOT smoke. ci.yml marks it advisory on non-schedule runs and it probes
      # production, which is a statement about the deploy, not about this tree.

  publish:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC; without it login silently has no identity
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Fail loudly BEFORE authenticating if the manifest and the code disagree
      # about the version. Publishing a version the Worker does not serve is
      # worse than not publishing: it makes the registry confidently wrong.
      - name: Check the manifest matches the served version
        run: |
          set -euo pipefail
          MANIFEST=$(node -p "require('./distribution/server.json').version")
          CODE=$(grep -oP 'SERVER_VERSION = "\K[^"]+' server/src/mcp.ts)
          echo "manifest=$MANIFEST code=$CODE"
          if [ "$MANIFEST" != "$CODE" ]; then
            echo "REFUSING: distribution/server.json says $MANIFEST but server/src/mcp.ts says $CODE." >&2
            exit 1
          fi
          # The registry caps description at 100 characters and rejects the
          # whole publish with a 422 if it is longer. Catch it here, where the
          # message is obvious, rather than after authenticating.
          DESC=$(node -p "require('./distribution/server.json').description.length")
          echo "description length=$DESC"
          [ "$DESC" -le 100 ] || { echo "REFUSING: description is $DESC chars, registry allows 100." >&2; exit 1; }

      # PINNED AND VERIFIED. This job can mint an OIDC token for the
      # io.github.asokore namespace, so it must not run whatever binary
      # "latest" points at on the day. To upgrade, change both lines: the
      # digest is on the release page, or from
      # gh api repos/modelcontextprotocol/registry/releases/tags/<tag>
      - name: Install mcp-publisher
        env:
          PUBLISHER_VERSION: v1.8.1
          PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version

      # mcp-publisher reads server.json from the working directory, so run it
      # from distribution/ where the manifest lives rather than copying it and
      # risking the copy drifting from the original.
      # IDEMPOTENT. The registry rejects a same-version republish with
      # "cannot publish duplicate version", so a bare publish made the manual
      # Run-workflow button a guaranteed red whenever the registry was already
      # current — which is precisely when a person presses it to check. A
      # dispatch means "make the registry match the repo": if it already does,
      # there is nothing to publish and the run is green.
      - name: Publish
        working-directory: distribution
        run: |
          set -euo pipefail
          EXPECTED=$(node -p "require('./server.json').version")
          CURRENT=$(curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers?search=statcite" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                const j=JSON.parse(s);
                const m=(j.servers||[]).filter(x=>(x.server||x).name==='io.github.asokore/statcite'&&(x._meta?.['io.modelcontextprotocol.registry/official']?.isLatest));
                console.log(m.length?(m[0].server||m[0]).version:'none');
              })")
          if [ "$CURRENT" = "$EXPECTED" ]; then
            echo "Registry already serves $EXPECTED as latest. Nothing to publish."
            exit 0
          fi
          echo "Registry serves $CURRENT, repo declares $EXPECTED. Publishing."
          ../mcp-publisher login github-oidc
          ../mcp-publisher publish

      # Trust the registry, not the exit code. A publish that returns 0 while
      # the registry still serves the old version is exactly the failure this
      # workflow exists to prevent, so assert against what the registry says.
      - name: Verify the registry actually serves the new version
        # RETRIES, not a single poll. On 2026-08-29 the publish succeeded and
        # the registry served the new version within a minute, but this step's
        # one 10-second sleep sampled too early, read the previous isLatest,
        # and marked a successful release run red. A sentinel that cries wolf
        # on propagation delay teaches people to ignore it, which defeats the
        # reason it exists.
        run: |
          set -euo pipefail
          EXPECTED=$(node -p "require('./distribution/server.json').version")
          for attempt in 1 2 3 4 5 6 7 8; do
            sleep 15
            LATEST=$(curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers?search=statcite" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                  const j=JSON.parse(s);
                  const m=(j.servers||[]).filter(x=>(x.server||x).name==='io.github.asokore/statcite'&&(x._meta?.['io.modelcontextprotocol.registry/official']?.isLatest));
                  console.log(m.length?(m[0].server||m[0]).version:'none');
                })")
            echo "attempt $attempt: registry isLatest = $LATEST, expected $EXPECTED"
            [ "$LATEST" = "$EXPECTED" ] && exit 0
          done
          echo "Registry did not serve $EXPECTED within 2 minutes." >&2
          exit 1
